// GENERAL
sensitivity 0.625
volume 0.5
fps_max 999
r_fullscreen_gamma 2.2
cl_autohelp 0

// CUSTOM BINDS
bind "5" "slot5; buy defuser;"
bind "4" "slot6" // he
bind "c" "slot7" // flash
bind "x" "slot8" // smoke
bind "z" "slot10" // molly
bind "alt" "switchhands"
bind "m" "toggle volume 0 0.5"
bind "p" "say !timeout"
bind "o" "say .p"
bind "v" "+voicerecord"
bind "j" "teammenu"
bind "e" "+lookatweapon"
bind "f" "+use"

// DEFAULT BINDS
bind "g" "drop"
bind "q" "lastinv"
bind "b" "buymenu"
bind "3" "slot3"
bind "ctrl" "+duck"
bind "shift" "+sprint"
bind "space" "+jump"
bind "mouse3" "player_ping"

// HUD
hud_scaling 10
cl_hud_color 10
cl_teamcounter_playercount_instead_of_avatars true
ui_steam_overlay_notification_position bottomleft
cl_weapon_selection_rarity_color true
cl_force_spec_hud_color_to_team true
cl_showloadout true
cl_sniper_show_inaccuracy false

// MAP
cl_hud_radar_background_alpha 0
cl_radar_always_centered false
cl_radar_scale .25
cl_radar_scale_alternate 1
cl_hud_radar_scale 1.3
cl_radar_rotate false
cl_hud_radar_blur_background false
cl_radar_square_always true

// FOV
viewmodel_presetpos 1
viewmodel_fov 100
viewmodel_offset_x 10
viewmodel_offset_y 10
viewmodel_offset_z -1.5

// CROSSHAIR
cl_crosshairgap "-4"
cl_crosshair_outlinethickness "0"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "0"
cl_crosshairalpha "255"
cl_crosshair_dynamic_splitdist "3"
cl_crosshair_recoil "false"
cl_fixedcrosshairgap "-2"
cl_crosshaircolor "4"
cl_crosshair_drawoutline "0"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshairthickness "1"
cl_crosshairdot "1"
cl_crosshairgap_useweaponvalue "0"
cl_crosshairusealpha "1"
cl_crosshair_t "0"
cl_crosshairstyle "4"
cl_crosshairsize "1"

echo "Do or do not. There is no try"